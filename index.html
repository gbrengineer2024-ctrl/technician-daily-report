<h1>หน้า GitHub Pages กำลังซ่อม</h1>
<p>ไฟล์ deploy ชุดก่อนหน้าเสียชั่วคราว จึงเข้าผ่าน Pages ไม่ได้</p>
<p><b>วิธีใช้ตอนนี้:</b> ให้โฮสต์แอพผ่าน Google Apps Script และตั้ง LIFF Endpoint เป็น URL ของ GAS (ลงท้าย /exec)</p>
<p class="note">ไม่ต้องอัพเดต Code.gs + แฟ้ม Index.html ในโปรเจกต์ Apps Script แล้ว Deploy ใหม่</p>
