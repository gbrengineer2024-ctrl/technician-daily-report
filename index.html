<script>
try {
  const b64 = (window.__PARTS||[]).join('');
  const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const html = new TextDecoder('utf-8').decode(bin);
  document.open();
  document.write(html);
  document.close();
} catch (e) {
  document.body.innerHTML = '<p style="font-family:sans-serif;padding:24px">โหลดไม่สำเร็จ: ' + e.message + '</p>';
  console.error(e);
}
